<body>
<svg width="0" height="0" style="position:absolute"><filter id="dryBrush"><feTurbulence baseFrequency=".028" numOctaves="4" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/><feGaussianBlur stdDeviation=".25"/></filter></svg>
<main class="stage" id="stage">
  <section id="world"><img class="map-image" src="assets/china_1892_liumingjie_2560.jpg" alt="古今地舆全图"><svg class="map" viewBox="0 0 2400 1400"><g id="routes"></g><g id="cities"></g></svg></section>
  <div class="reading-shade"></div>
  <div class="map-title"><div class="eyebrow">年谱数字人文</div><div class="cn-title"><b>黄</b>宾虹<br>生命舆图</div><div class="read-note"><strong>1865—1955</strong><br>一条朱砂线标出四次居所转换；青线标出当年的往返游历。</div><div class="map-legend"><div><i></i><b>迁居主线</b>　走过后留痕</div><div class="blue"><i></i><b>当年往返</b>　只在该年点亮</div></div><div class="seal">虹</div></div>

</main>
<script>
(function(){
const stage=document.getElementById('stage'),world=document.getElementById('world'),routes=document.getElementById('routes'),cityLayer=document.getElementById('cities'),callouts=document.getElementById('callouts'),screenLines=document.getElementById('screenLines'),yearBadge=document.getElementById('yearBadge'),progress=document.getElementById('progress'),rail=document.getElementById('rail'),pauseBtn=document.getElementById('pauseBtn'),detail=document.getElementById('detail'),detailTitle=document.getElementById('detailTitle'),detailText=document.getElementById('detailText'),detailClose=document.getElementById('detailClose'),friendGrid=document.getElementById('friendGrid'),storyLine=document.getElementById('storyLine'),storySub=document.getElementById('storySub');
const J=window.JOURNEY||{byYear:{}},O=window.HBH_OVERVIEW||{yearStats:[]},stats=new Map((O.yearStats||[]).map(d=>[+d.year,d]));
const city={北京:[1485,250],北平:[1485,250],天津:[1552,318],济南:[1515,470],南京:[1588,684],扬州:[1598,628],苏州:[1736,724],上海:[1824,720],杭州:[1700,812],西湖:[1700,812],绍兴:[1748,846],宁波:[1840,884],金华:[1582,908],歙县:[1490,846],徽州:[1490,846],潭渡:[1490,846],黄山:[1452,805],芜湖:[1512,726],安庆:[1378,778],武汉:[1288,836],长沙:[1262,1008],桂林:[1178,1120],广州:[1354,1190],香港:[1415,1248],福建:[1652,1058],福州:[1685,1050],厦门:[1610,1168],成都:[852,878],重庆:[960,960],峨眉山:[782,936],镇江:[1616,596],嘉兴:[1766,760],无锡:[1694,692],栖霞山:[1588,684],洛阳:[1240,452]};
const yearKeys=Object.keys(J.byYear||{}).map(Number).filter(y=>y>=1865&&y<=1955).sort((a,b)=>a-b);
function anchorPlace(y){const r=J.byYear[String(y)]||{};let p=r.anchor&&r.anchor.place;if(!city[p])p=((r.travels||[]).find(t=>city[t.place])||{}).place;if(!city[p])p=y<1907?'歙县':y<1937?'上海':y<1948?'北京':'杭州';return p}
function scaleFor(y,p){if(y<1907)return 1.50;if(y<1937)return ['广州','香港','桂林'].includes(p)?1.18:1.48;if(y<1948)return 1.25;return 1.44}
const titleByYear={1865:'出生 · 金华',1873:'临画 · 西湖',1886:'徽州根基',1907:'星夜赴沪',1928:'南行远游',1937:'北上转折',1948:'南返杭州',1955:'归于西湖'};
const storyByYear={
  1865:['金华出生，祖籍徽州。','基地 金华｜出生'],
  1873:['随父到杭州，临摹与写生开始进入年谱。','基地 歙县｜往返 杭州'],
  1886:['居歙县，家学、婚姻、金石文字并入生活。','基地 歙县｜居住与家学'],
  1907:['从徽州赴上海，人生主线转入海上。','迁居 歙县 → 上海｜四十二岁'],
  1928:['以上海为基地，南行广州、香港、桂林。','基地 上海｜南行远游'],
  1937:['离开上海，转入北平任教。','迁居 上海 → 北平｜七十二岁'],
  1948:['南返杭州，晚年居所固定在西湖一带。','迁居 北平 → 杭州｜八十三岁'],
  1955:['杭州辞世，文稿与作品进入公共收藏。','基地 杭州｜逝世']
};
const eraBands=[
  {start:1865,end:1906,name:'徽州／金华'},
  {start:1907,end:1936,name:'上海'},
  {start:1937,end:1947,name:'北平'},
  {start:1948,end:1955,name:'杭州'}
];
const scenes=(yearKeys.length?yearKeys:Array.from({length:91},(_,i)=>1865+i)).map(y=>{const place=anchorPlace(y);return{year:y,place,scale:scaleFor(y,place),title:titleByYear[y]||`${place} · ${y}`}});
const mainYears=[1865,1873,1886,1907,1928,1937,1948,1955];
function S(n,a={},t){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e}
function q(a,b,bend=.18){const[x1,y1]=a,[x2,y2]=b,mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;return`M${x1},${y1} Q${mx-dy/l*l*bend},${my+dx/l*l*bend} ${x2},${y2}`}
function draw(){
  const visited=new Set();
  scenes.forEach(sc=>{if(city[sc.place])visited.add(sc.place);travelItems(sc).forEach(t=>{if(city[t.place])visited.add(t.place)});const y=J.byYear[String(sc.year)]||{};(y.moves||[]).forEach(m=>{if(city[m.from]&&city[m.to]){visited.add(m.from);visited.add(m.to)}})});
  ['金华','歙县','上海','北京'].forEach((p,i)=>{const b=['歙县','上海','北京','杭州'][i],d=q(city[p],city[b],i===2?-.34:.18);routes.appendChild(S('path',{d,class:'routeGhost'}));const seg=S('path',{d,class:'routeSeg','stroke-width':[4,6,5,5][i]});routes.appendChild(seg);const l=seg.getTotalLength();seg.style.strokeDasharray=l;seg.style.strokeDashoffset=l;seg.style.opacity=.18});
  const allTrips=new Map();
  scenes.forEach(sc=>{const home=city[sc.place]?sc.place:anchorPlace(sc.year);travelItems(sc).forEach(t=>{if(city[t.place]&&t.place!==home){const key=`${home}|${t.place}`;if(!allTrips.has(key))allTrips.set(key,sc.year)}})});
  allTrips.forEach((firstYear,key)=>{const [a,b]=key.split('|');routes.appendChild(S('path',{d:q(city[a],city[b],.10),class:'visitLine future','data-a':a,'data-b':b,'data-year':firstYear}))});
  Object.entries(city).forEach(([n,p])=>{if(['北平','西湖','徽州','潭渡','栖霞山'].includes(n))return;const major=['北京','上海','杭州','金华','歙县','广州','香港','桂林','南京','苏州','黄山'].includes(n),seen=visited.has(n)||visited.has(n==='北京'?'北平':n);cityLayer.appendChild(S('circle',{cx:p[0],cy:p[1],r:major?7:4,class:'city-dot',opacity:seen?1:.24}));cityLayer.appendChild(S('circle',{cx:p[0],cy:p[1],r:8,class:'city-pulse',id:'pulse_'+n}));cityLayer.appendChild(S('text',{x:p[0]+12,y:p[1]-10,class:major?'city-label':'minor-label',opacity:seen?1:.28},n))});
  mainYears.concat([1912]).sort((a,b)=>a-b).forEach(y=>{const t=document.createElement('span');t.className='tick';t.style.left=((y-1865)/90*100)+'%';t.textContent=y;rail.appendChild(t)})
  eraBands.forEach(b=>{const e=document.createElement('span');e.className='eraSeg';e.dataset.start=b.start;e.dataset.end=b.end;e.style.left=((b.start-1865)/90*100)+'%';e.style.width=((b.end-b.start+1)/90*100)+'%';e.textContent=b.name;rail.appendChild(e)})
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}let trans={tx:0,ty:0,s:1};
function focus(place,scale){const p=city[place]||city.上海,vw=stage.clientWidth,vh=stage.clientHeight,tx=vw/2-p[0]*scale,ty=vh/2-p[1]*scale;trans={tx,ty,s:scale};world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function worldToScreen(p){return{x:p[0]*trans.s+trans.tx,y:p[1]*trans.s+trans.ty}}
function clean(s,n=42){return String(s||'').replace(/\s+/g,'').replace(/[□�]/g,'').slice(0,n)}
function ageOf(y){return y-1865}
function chapterOf(y){return eraBands.find(b=>y>=b.start&&y<=b.end)||eraBands[0]}
function travelVerb(n){return n?`往返 ${n}`:'停留'}
function storyFor(sc){
  const trips=travelItems(sc),ch=chapterOf(sc.year),base=sc.place;
  if(storyByYear[sc.year])return storyByYear[sc.year];
  if(trips.length)return [`${sc.year} 年，以${base}为基地，短途到 ${trips.map(t=>t.place).slice(0,3).join('、')}。`,`基地 ${base}｜${travelVerb(trips[0].place)}｜${ageOf(sc.year)} 岁`];
  const y=yearData(sc),p=(y.interactions||[]).find(x=>x.name),c=(y.creations||[]).find(x=>x.title||x.type);
  if(p)return [`${sc.year} 年，仍在${base}，年谱记录与${p.name}的${p.type||'往来'}。`,`基地 ${base}｜人物 ${p.name}｜${ageOf(sc.year)} 岁`];
  if(c)return [`${sc.year} 年，仍在${base}，年谱留下${c.type||'创作'}记录。`,`基地 ${base}｜${c.type||'创作'}｜${ageOf(sc.year)} 岁`];

function updateStory(sc){

function hasActionText(s){return /(赴|至|到|抵|往|游|登|访|来访|造访|寓|居|迁|任教|开会|展|展览|写生|过|路经|道经|下榻)/.test(String(s||''))}

function isFalsePlace(t,home){

  if(/(她|胡适|孔达|德里斯珂|朋友们)/.test(txt)&&!/黄宾虹|宾虹|先生|余|予|鄙人/.test(txt))return true;
  if(new RegExp(`${p}人|属${p}|${p}画派|${p}时期|${p}诗|${p}图|${p}纪游|${p}追忆`).test(txt))return true;
  if(new RegExp(`代由${p}转寄|在京系用${p}|曾游${p}|尝游${p}|同游北平|${p}来友|${p}画史`).test(txt))return true;
  if(new RegExp(`返国|转${p}|${p}返|转.*返|返.*云`).test(txt))return true;
  if(/沪港美展|家富收藏|壮岁游苏浙|东渡|八十多岁|木偶雕刻家|南京许多名画家|中央美院进修|会场推毂/.test(txt))return true;
  if(/(画派|诗草|诗留|旧稿|书法史|史籍考|时期|朋友们|著述|画论|画史|题跋|款识)/.test(txt)&&!/(赴|至|抵|下榻|迁居|任教|参加|来访|造访|登门|游览|写生)/.test(txt))return true;
  return !hasActionText(txt)
}
function homeOfYear(y){return anchorPlace(y)}
function yearData(sc){return J.byYear[String(sc.year)]||{}}
function travelItems(sc){
  const y=yearData(sc),home=sc.place,seen=new Set(),items=[];
  (y.travels||[]).forEach((t,idx)=>{if(city[t.place]&&!isFalsePlace(t,home)&&!seen.has(t.place)){seen.add(t.place);items.push({place:t.place,text:t.text||'',idx})}});

function orderedYearItems(sc){

function slot(n){
  const vw=stage.clientWidth,vh=stage.clientHeight,x=vw-396,top=clamp(214,170,vh-430),step=48;
  return Array.from({length:n},(_,i)=>({x,y:clamp(top+i*step,70,vh-92)}))

const sceneFacts={
  1865:'生于浙江金华县城西铁岭头，祖籍歙县潭渡。',
  1873:'临摹《松菊图》；随父游杭州并写生。',
  1886:'居歙县，婚姻、疾病、家学、金石文字并入年谱。',
  1907:'由歙县赴上海，入国学保存会、《神州日报》与海上美术圈。',
  1928:'南行广州、香港、桂林；展览、社团、画友记录骤密。',
  1937:'由上海转北平，任北平艺专教授。',
  1948:'赴杭州任国立艺专教授。',
  1955:'在杭州辞世，作品与文稿进入公共收藏。'
};
const friendLast=new Map(),friendFirst=new Map();
Object.entries(J.byYear||{}).forEach(([yy,d])=>{const y=+yy;[...(d.people_new||[]),...(d.interactions||[])].forEach(p=>{if(!p.name)return;if(!friendFirst.has(p.name))friendFirst.set(p.name,y);friendLast.set(p.name,y)})});
function notes(sc){
  return orderedYearItems(sc).filter(it=>!(it.kind==='travel'&&!travelItems(sc).some(t=>t.place===it.place))).sort((a,b)=>(a.group-b.group)||(a.order-b.order)).map(it=>({
    k:it.label,
    h:it.title||it.place,
    t:clean(it.text,42),
    place:it.place,
    avatar:it.avatar,
    group:it.group,
    full:it.full||it.text,

const RED_SEGMENTS=[
  {seg:0,start:1865,end:1865},
  {seg:1,start:1866,end:1907},
  {seg:2,start:1908,end:1937},
  {seg:3,start:1938,end:1948}
];
function yearWeight(sc,seg){
  const n=travelItems(sc).length;
  return n || (sc.year===seg.end?1:0)
}
function redLocal(seg,currentYear,unit){
  if(currentYear<seg.start)return 0;
  if(currentYear>seg.end)return 1;
  const ys=scenes.filter(s=>s.year>=seg.start&&s.year<=seg.end),weights=ys.map(s=>yearWeight(s,seg)),total=weights.reduce((a,b)=>a+b,0);
  if(!total)return (currentYear-seg.start+unit)/(seg.end-seg.start+1);
  let done=0;
  ys.forEach((s,i)=>{if(s.year<currentYear)done+=weights[i];else if(s.year===currentYear)done+=weights[i]*unit});
  return clamp(done/total,0,1)
}
function updateProgress(idx,unit){
  const cur=scenes[idx]||scenes[0],segEls=[...routes.querySelectorAll('.routeSeg')];
  RED_SEGMENTS.forEach(rs=>{const p=segEls[rs.seg];if(!p)return;const l=p.getTotalLength(),local=redLocal(rs,cur.year,unit);p.style.strokeDashoffset=l*(1-local);p.style.opacity=local>0||cur.year>=rs.start?1:.18});
  progress.style.width=((cur.year-1865+unit)/90*100)+'%'
}
function updateVisitLines(sc,step=0,lineRatio=1){
  const home=sc.place,items=travelItems(sc),active=items[step],hot=active&&lineRatio>0?[`${home}|${active.place}`]:[];
  routes.querySelectorAll('.visitHot').forEach(e=>e.remove());
  routes.querySelectorAll('.travelDot').forEach(e=>e.remove());
  const yearSeen=new Set(items.map(t=>`${home}|${t.place}`));
  routes.querySelectorAll('.visitLine').forEach(e=>{const key=`${e.dataset.a}|${e.dataset.b}`,first=+e.dataset.year||1865;e.classList.remove('past','current','future');e.classList.add(yearSeen.has(key)?'current':first>sc.year?'future':'past')});
  items.forEach(t=>{const path=S('path',{d:q(city[home],city[t.place],.10),class:'visitHot yearTrace'});routes.appendChild(path)});
  hot.forEach(key=>{const[a,b]=key.split('|'),path=S('path',{d:q(city[a],city[b],.10),class:'visitHot'});routes.appendChild(path);const l=path.getTotalLength(),r=clamp(lineRatio,0,1);path.style.strokeDasharray=l;path.style.strokeDashoffset=l*(1-r);const pt=path.getPointAtLength(l*r);routes.appendChild(S('circle',{cx:pt.x,cy:pt.y,r:5,class:'travelDot'}))})
}
function updateFriends(year){
  const active=new Set(((J.byYear[String(year)]||{}).interactions||[]).map(p=>p.name)),newset=new Set(((J.byYear[String(year)]||{}).people_new||[]).map(p=>p.name));

  friendGrid.innerHTML='';

}
function show(sc,idx,ratio){
  if(!sc)return;focus(sc.place,sc.scale);updateStory(sc);yearBadge.classList.add('show');
  document.querySelectorAll('.city-pulse').forEach(e=>e.classList.remove('on'));const pu=document.getElementById('pulse_'+sc.place);if(pu)pu.classList.add('on');
  callouts.innerHTML='';screenLines.innerHTML='';
  updateVisitLines(sc,0,1);updateFriends(sc.year);
  const all=notes(sc),visible=all.filter(n=>!(n.kind==='travel'&&n.place===sc.place)),ns=visible.slice(0,5),ss=slot(ns.length);

    const pt=worldToScreen(city[n.place]||city[sc.place]||city.上海),d=document.createElement('div');

    d.innerHTML=`<span class="k">${n.k}</span><span class="h">${n.avatar?`<span class="avatarMark">${String(n.avatar).slice(0,1)}</span>`:''}${n.h}</span><div class="t">${n.t}</div>`;
    d.onclick=()=>{detailTitle.textContent=n.h.replace(/<[^>]*>/g,'');detailText.textContent=n.full||n.t;detail.classList.add('show')};
    callouts.appendChild(d);
    const tx=ss[i].x,ty=ss[i].y+15,mx=clamp((pt.x+tx)/2,pt.x,tx);

function playYear(sc,idx,yearRatio){
  if(!sc)return;focus(sc.place,sc.scale);updateStory(sc);yearBadge.classList.add('show');
  document.querySelectorAll('.city-pulse').forEach(e=>e.classList.remove('on'));const pu=document.getElementById('pulse_'+sc.place);if(pu)pu.classList.add('on');
  const trips=travelItems(sc),travelCount=trips.length,travelPart=travelCount?Math.min(.76,.28+travelCount*.12):.18;

  if(travelCount&&yearRatio<travelPart){const u=yearRatio/travelPart*travelCount,phase=u-Math.floor(u);step=clamp(Math.floor(u),0,travelCount-1);lineRatio=phase<.62?phase/.62:1}else if(travelCount){step=travelCount-1;lineRatio=.28}
  updateVisitLines(sc,step,lineRatio);updateFriends(sc.year);
  const all=notes(sc).filter(n=>!(n.kind==='travel'&&n.place===sc.place));
  const reveal=travelCount&&yearRatio<travelPart?Math.max(1,Math.min(all.length,step+1)):Math.min(all.length,Math.floor((yearRatio-travelPart)/(1-travelPart)*all.length)+1);
  const ns=all.slice(0,clamp(reveal,1,5)),ss=slot(ns.length);callouts.innerHTML='';screenLines.innerHTML='';
  ns.forEach((n,i)=>{const pt=worldToScreen(city[n.place]||city[sc.place]||city.上海),d=document.createElement('div');d.className='caption show';d.style.left=ss[i].x+'px';d.style.top=ss[i].y+'px';d.innerHTML=`<span class="k">${n.k}</span><span class="h">${n.avatar?`<span class="avatarMark">${String(n.avatar).slice(0,1)}</span>`:''}${n.h}</span><div class="t">${n.t}</div>`;d.onclick=()=>{detailTitle.textContent=n.h.replace(/<[^>]*>/g,'');detailText.textContent=n.full||n.t;detail.classList.add('show')};callouts.appendChild(d);const tx=ss[i].x,ty=ss[i].y+15,mx=clamp((pt.x+tx)/2,pt.x,tx);screenLines.appendChild(S('path',{d:`M${pt.x},${pt.y} H${mx} V${ty} H${tx}`}));screenLines.appendChild(S('circle',{cx:pt.x,cy:pt.y,r:1.7}))});
  updateProgress(idx,yearRatio)
}
detailClose.onclick=()=>detail.classList.remove('show');
window.__HBH_DEBUG={scenes,playYear,travelItems,notes,orderedYearItems,setPaused:v=>{paused=!!v}};
draw();let start=performance.now(),paused=false,last=-1;function loop(now){if(!paused){const dur=4200,total=dur*scenes.length,raw=Math.max(0,now-start),el=raw%total,idx=clamp(Math.floor(el/dur),0,scenes.length-1),r=(el%dur)/dur;playYear(scenes[idx],idx,r);last=idx}requestAnimationFrame(loop)}pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'继续':'暂停'};show(scenes[0],0,0);requestAnimationFrame(loop);
