  <style>
    :root{--paper:#efe7d8;--ink:#15120e;--red:#a92b22;--blue:#2d6670}

    .city-dot{fill:#17120e;stroke:#efe7d8;stroke-width:3}.city-pulse{fill:none;stroke:#a92b22;stroke-width:1.2;opacity:.0}.city-pulse.on{opacity:.62}
    #screenLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:18;overflow:visible}
    #screenLines path{fill:none;stroke:rgba(17,15,11,.78);stroke-width:1.18;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
    #screenLines circle{fill:#15120e;opacity:.86}

      transition:opacity 420ms cubic-bezier(.25,1,.5,1),transform 420ms cubic-bezier(.25,1,.5,1);text-shadow:0 1px 0 rgba(246,239,226,.9);
      padding:5px 7px 6px 8px;background:
      repeating-linear-gradient(0deg,rgba(91,67,42,.045) 0 1px,transparent 1px 5px),
      rgba(239,231,216,.72);border-left:1.2px solid rgba(21,18,14,.70);box-shadow:0 2px 10px rgba(32,24,17,.08)}
    .caption.show{opacity:1;transform:translateY(0)}
    .caption .k{display:inline-block;width:38px;margin-right:6px;color:#a92b22;font:900 9px/1 "Noto Serif SC","SimSun",serif;letter-spacing:.14em}
    .caption .h{display:inline;font-weight:900;font-size:10.8px;color:#0d0b09}.caption .t{display:block;margin-left:44px;color:#14110e}.caption .small{display:block;margin-top:2px;color:#36302a;font-size:9px;line-height:1.35}
    .avatarMark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#17120e;color:#efe7d8;font:700 9px/1 Georgia,"Noto Serif SC",serif;vertical-align:-4px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(239,231,216,.9)}

    .year-badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.year-badge .y{font:900 48px/.84 Georgia,"Times New Roman",serif;letter-spacing:-.05em;color:#a92b22}.year-badge .p{font:700 13px/1.2 "Noto Serif SC","SimSun",serif;letter-spacing:.12em;margin-left:3px;color:#1d1813}
    .rail{position:absolute;left:34px;right:34px;bottom:24px;height:58px;z-index:30;pointer-events:none;font-family:Georgia,"Times New Roman",serif;color:#17120e}
    .rail .bar{position:absolute;left:0;right:0;top:28px;height:2px;background:rgba(25,20,15,.18)}.rail .bar i{display:block;width:0;height:2px;background:#a92b22}
    .tick{position:absolute;top:19px;transform:translateX(-50%);font-size:10px;color:#3e342b}.tick:before{content:"";display:block;width:1px;height:16px;background:rgba(20,17,13,.42);margin:0 auto 4px}
    .control{position:absolute;right:38px;bottom:92px;z-index:35;border:0;background:transparent;color:#15120e;font:700 12px/1 "Noto Serif SC","SimSun",serif;letter-spacing:.18em;border-bottom:1px solid rgba(21,18,14,.75);cursor:pointer;padding:0 0 4px}
    .detail{position:absolute;right:36px;bottom:148px;width:340px;max-height:230px;overflow:auto;z-index:40;display:none;background:rgba(240,232,218,.94);box-shadow:0 18px 48px rgba(30,20,12,.18);border-left:2px solid var(--red);padding:12px 14px;color:#15110d;font-size:11px;line-height:1.62}
    .detail.show{display:block}.detail b{color:var(--red);font-size:12px}.detail button{float:right;border:0;background:transparent;color:#15110d;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="dryBrush"><feTurbulence baseFrequency=".028" numOctaves="4" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/><feGaussianBlur stdDeviation=".25"/></filter></svg>
<main class="stage" id="stage">
  <section id="world"><img class="map-image" src="assets/china_1892_liumingjie_2560.jpg" alt="古今地舆全图"><svg class="map" viewBox="0 0 2400 1400"><g id="routes"></g><g id="cities"></g></svg></section>
  <div class="reading-shade"></div>
  <div class="map-title"><div class="eyebrow">年谱数字人文</div><div class="cn-title"><b>黄</b>宾虹<br>生命舆图</div><div class="read-note"><strong>1865—1955</strong><br>金华｜歙县｜上海｜北平｜杭州</div><div class="seal">虹</div></div>
  <svg id="screenLines"></svg><div id="callouts"></div><aside class="friendPanel" id="friendPanel"><div class="fh">结交</div><div class="hint">逐年累加／离去转淡</div><div class="friendGrid" id="friendGrid"></div></aside><div class="year-badge" id="yearBadge"><div class="y">1865</div><div class="p">金华 · 出生</div></div>
  <aside class="detail" id="detail"><button id="detailClose">×</button><b id="detailTitle"></b><div id="detailText"></div></aside>
  <button class="control" id="pauseBtn">暂停</button><div class="rail" id="rail"><div class="bar"><i id="progress"></i></div></div>
</main>
<script>
(function(){
const stage=document.getElementById('stage'),world=document.getElementById('world'),routes=document.getElementById('routes'),cityLayer=document.getElementById('cities'),callouts=document.getElementById('callouts'),screenLines=document.getElementById('screenLines'),yearBadge=document.getElementById('yearBadge'),progress=document.getElementById('progress'),rail=document.getElementById('rail'),pauseBtn=document.getElementById('pauseBtn'),detail=document.getElementById('detail'),detailTitle=document.getElementById('detailTitle'),detailText=document.getElementById('detailText'),detailClose=document.getElementById('detailClose'),friendGrid=document.getElementById('friendGrid');
const J=window.JOURNEY||{byYear:{}},O=window.HBH_OVERVIEW||{yearStats:[]},stats=new Map((O.yearStats||[]).map(d=>[+d.year,d]));
const city={北京:[1485,250],北平:[1485,250],天津:[1552,318],济南:[1515,470],南京:[1588,684],扬州:[1598,628],苏州:[1736,724],上海:[1824,720],杭州:[1700,812],西湖:[1700,812],绍兴:[1748,846],宁波:[1840,884],金华:[1582,908],歙县:[1490,846],徽州:[1490,846],潭渡:[1490,846],黄山:[1452,805],芜湖:[1512,726],安庆:[1378,778],武汉:[1288,836],长沙:[1262,1008],桂林:[1178,1120],广州:[1354,1190],香港:[1415,1248],福建:[1652,1058],福州:[1685,1050],厦门:[1610,1168],成都:[852,878],重庆:[960,960],峨眉山:[782,936],镇江:[1616,596],嘉兴:[1766,760],无锡:[1694,692],栖霞山:[1588,684],洛阳:[1240,452]};
const yearKeys=Object.keys(J.byYear||{}).map(Number).filter(y=>y>=1865&&y<=1955).sort((a,b)=>a-b);
function anchorPlace(y){const r=J.byYear[String(y)]||{};let p=r.anchor&&r.anchor.place;if(!city[p])p=((r.travels||[]).find(t=>city[t.place])||{}).place;if(!city[p])p=y<1907?'歙县':y<1937?'上海':y<1948?'北京':'杭州';return p}
function scaleFor(y,p){if(y<1907)return 1.50;if(y<1937)return ['广州','香港','桂林'].includes(p)?1.18:1.48;if(y<1948)return 1.25;return 1.44}
const titleByYear={1865:'出生 · 金华',1873:'临画 · 西湖',1886:'徽州根基',1907:'星夜赴沪',1928:'南行远游',1937:'北上转折',1948:'南返杭州',1955:'归于西湖'};
const scenes=(yearKeys.length?yearKeys:Array.from({length:91},(_,i)=>1865+i)).map(y=>{const place=anchorPlace(y);return{year:y,place,scale:scaleFor(y,place),title:titleByYear[y]||`${place} · ${y}`}});
const mainYears=[1865,1873,1886,1907,1928,1937,1948,1955];
function S(n,a={},t){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e}
function q(a,b,bend=.18){const[x1,y1]=a,[x2,y2]=b,mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;return`M${x1},${y1} Q${mx-dy/l*l*bend},${my+dx/l*l*bend} ${x2},${y2}`}
function draw(){
  const visited=new Set();
  scenes.forEach(sc=>{if(city[sc.place])visited.add(sc.place);const y=J.byYear[String(sc.year)]||{};(y.travels||[]).forEach(t=>{if(city[t.place])visited.add(t.place)});(y.moves||[]).forEach(m=>{if(city[m.from]&&city[m.to]){visited.add(m.from);visited.add(m.to)}})});
  ['金华','歙县','上海','北京'].forEach((p,i)=>{const b=['歙县','上海','北京','杭州'][i],d=q(city[p],city[b],i===2?-.34:.18);routes.appendChild(S('path',{d,class:'routeGhost'}));const seg=S('path',{d,class:'routeSeg','stroke-width':[20,34,28,26][i]});routes.appendChild(seg);const l=seg.getTotalLength();seg.style.strokeDasharray=l;seg.style.strokeDashoffset=l});
  const allTrips=new Set();
  scenes.forEach(sc=>{const y=J.byYear[String(sc.year)]||{},home=city[sc.place]?sc.place:anchorPlace(sc.year);(y.moves||[]).forEach(m=>{const a=city[m.from]?m.from:home,b=city[m.to]?m.to:null;if(b&&a!==b)allTrips.add(`${a}|${b}`)});(y.travels||[]).forEach(t=>{if(city[t.place]&&t.place!==home)allTrips.add(`${home}|${t.place}`)})});
  allTrips.forEach(key=>{const [a,b]=key.split('|');routes.appendChild(S('path',{d:q(city[a],city[b],.10),class:'visitLine','data-a':a,'data-b':b}))});
  Object.entries(city).forEach(([n,p])=>{if(['北平','西湖','徽州','潭渡','栖霞山'].includes(n))return;const major=['北京','上海','杭州','金华','歙县','广州','香港','桂林','南京','苏州','黄山'].includes(n),seen=visited.has(n)||visited.has(n==='北京'?'北平':n);cityLayer.appendChild(S('circle',{cx:p[0],cy:p[1],r:major?7:4,class:'city-dot',opacity:seen?1:.24}));cityLayer.appendChild(S('circle',{cx:p[0],cy:p[1],r:8,class:'city-pulse',id:'pulse_'+n}));cityLayer.appendChild(S('text',{x:p[0]+12,y:p[1]-10,class:major?'city-label':'minor-label',opacity:seen?1:.28},n))});
  mainYears.concat([1912]).sort((a,b)=>a-b).forEach(y=>{const t=document.createElement('span');t.className='tick';t.style.left=((y-1865)/90*100)+'%';t.textContent=y;rail.appendChild(t)})
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}let trans={tx:0,ty:0,s:1};
function focus(place,scale){const p=city[place]||city.上海,vw=stage.clientWidth,vh=stage.clientHeight,tx=vw/2-p[0]*scale,ty=vh/2-p[1]*scale;trans={tx,ty,s:scale};world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function worldToScreen(p){return{x:p[0]*trans.s+trans.tx,y:p[1]*trans.s+trans.ty}}
function clean(s,n=42){return String(s||'').replace(/\s+/g,'').replace(/[□�]/g,'').slice(0,n)}
function slot(n){
  const vw=stage.clientWidth,vh=stage.clientHeight,x=vw-486,top=clamp(118,86,vh-430),step=48;
  return Array.from({length:n},(_,i)=>({x,y:clamp(top+i*step,70,vh-92)}))
}
const sceneFacts={
  1865:'生于浙江金华县城西铁岭头，祖籍歙县潭渡。',
  1873:'临摹《松菊图》；随父游杭州并写生。',
  1886:'居歙县，婚姻、疾病、家学、金石文字并入年谱。',
  1907:'由歙县赴上海，入国学保存会、《神州日报》与海上美术圈。',
  1928:'南行广州、香港、桂林；展览、社团、画友记录骤密。',
  1937:'由上海转北平，任北平艺专教授。',
  1948:'赴杭州任国立艺专教授。',
  1955:'在杭州辞世，作品与文稿进入公共收藏。'
};
const friendLast=new Map(),friendFirst=new Map();
Object.entries(J.byYear||{}).forEach(([yy,d])=>{const y=+yy;[...(d.people_new||[]),...(d.interactions||[])].forEach(p=>{if(!p.name)return;if(!friendFirst.has(p.name))friendFirst.set(p.name,y);friendLast.set(p.name,y)})});
function notes(sc){
  const y=J.byYear[String(sc.year)]||{},out=[],seen=new Set();
  out.push({k:'年',h:`${sc.year}`,t:sceneFacts[sc.year]||sc.title,place:sc.place,group:0,full:sceneFacts[sc.year]||sc.title});
  (y.travels||[]).filter(t=>city[t.place]||t.place===sc.place).forEach(t=>{if(out.length<4&&!seen.has('地'+t.place)){seen.add('地'+t.place);out.push({k:'地',h:t.place||sc.place,t:clean(t.text,42),place:t.place||sc.place,group:1,full:t.text})}});
  (y.interactions||[]).filter(p=>p.name).slice(0,3).forEach(p=>out.push({k:'友',h:`${p.name}｜${p.type||'交往'}`,t:clean(p.text,38),place:sc.place,avatar:p.name,group:2,full:p.text}));
  (y.people_new||[]).filter(p=>p.name).slice(0,2).forEach(p=>out.push({k:'新',h:p.name,t:`${p.cat||'师友'}｜首见`,place:sc.place,avatar:p.name,group:2,full:`${p.name}｜${p.cat||'师友'}｜首见 ${sc.year}`}));
  (y.creations||[]).filter(c=>c.title||c.type).slice(0,2).forEach(c=>out.push({k:'作',h:`${c.type||'创作'}｜${c.title||c.subject||'未题'}`,t:clean(c.text,40),place:sc.place,group:3,full:c.text}));
  (y.era||[]).slice(0,1).forEach(e=>out.push({k:'世',h:e.category||'同年',t:e.event.replace(/（.*?）/g,''),place:sc.place,group:4,full:e.event}));
  return out.sort((a,b)=>a.group-b.group).slice(0,8)
}
function updateProgress(idx,ratio){const cur=scenes[idx]||scenes[0],year=cur.year+ratio;const seg=[...routes.querySelectorAll('.routeSeg')];seg.forEach((p,i)=>{const l=p.getTotalLength(),local=clamp(((year-1865)/90*4)-i,0,1);p.style.strokeDashoffset=l*(1-local)});progress.style.width=((year-1865)/90*100)+'%'}
function updateVisitLines(sc){
  const y=J.byYear[String(sc.year)]||{},home=sc.place,hot=new Set();
  (y.moves||[]).forEach(m=>{const a=city[m.from]?m.from:home,b=city[m.to]?m.to:null;if(b)hot.add(`${a}|${b}`)});
  (y.travels||[]).forEach(t=>{if(city[t.place]&&t.place!==home)hot.add(`${home}|${t.place}`)});
  routes.querySelectorAll('.visitHot').forEach(e=>e.remove());
  hot.forEach(key=>{const[a,b]=key.split('|');routes.appendChild(S('path',{d:q(city[a],city[b],.10),class:'visitHot'}))})
}
function updateFriends(year){
  const active=new Set(((J.byYear[String(year)]||{}).interactions||[]).map(p=>p.name)),newset=new Set(((J.byYear[String(year)]||{}).people_new||[]).map(p=>p.name));
  const names=[...friendFirst.entries()].filter(([n,fy])=>fy<=year).sort((a,b)=>a[1]-b[1]).slice(-80).map(x=>x[0]);
  friendGrid.innerHTML='';
  names.forEach(n=>{const d=document.createElement('div'),last=friendLast.get(n)||year;d.className='friendAvatar '+(newset.has(n)?'new':active.has(n)?'active':last<year-10?'gone':'');d.title=`${n}｜${friendFirst.get(n)}—${last}`;d.textContent=n.slice(0,1);friendGrid.appendChild(d)})
}
function show(sc,idx,ratio){
  if(!sc)return;focus(sc.place,sc.scale);yearBadge.querySelector('.y').textContent=sc.year;yearBadge.querySelector('.p').textContent=sc.title;yearBadge.style.left=clamp(stage.clientWidth-284,760,stage.clientWidth-212)+'px';yearBadge.style.top='54px';yearBadge.classList.add('show');
  document.querySelectorAll('.city-pulse').forEach(e=>e.classList.remove('on'));const pu=document.getElementById('pulse_'+sc.place);if(pu)pu.classList.add('on');
  callouts.innerHTML='';screenLines.innerHTML='';
  updateVisitLines(sc);updateFriends(sc.year);
  const ns=notes(sc),ss=slot(ns.length);
  ns.forEach((n,i)=>{
    const pt=worldToScreen(city[n.place]||city[sc.place]||city.上海),d=document.createElement('div');
    d.className='caption show';d.style.left=ss[i].x+'px';d.style.top=ss[i].y+'px';
    d.innerHTML=`<span class="k">${n.k}</span><span class="h">${n.avatar?`<span class="avatarMark">${String(n.avatar).slice(0,1)}</span>`:''}${n.h}</span><div class="t">${n.t}</div>`;
    d.onclick=()=>{detailTitle.textContent=n.h.replace(/<[^>]*>/g,'');detailText.textContent=n.full||n.t;detail.classList.add('show')};
    callouts.appendChild(d);
    const tx=ss[i].x,ty=ss[i].y+15,mx=clamp((pt.x+tx)/2,pt.x,tx);
    screenLines.appendChild(S('path',{d:`M${pt.x},${pt.y} H${mx} V${ty} H${tx}`}));
    screenLines.appendChild(S('circle',{cx:pt.x,cy:pt.y,r:1.7}));
  });
  updateProgress(idx,ratio)
}
detailClose.onclick=()=>detail.classList.remove('show');
draw();let start=performance.now(),paused=false,last=-1;function loop(now){if(!paused){const dur=1180,total=dur*scenes.length,raw=Math.max(0,now-start),el=raw%total,idx=clamp(Math.floor(el/dur),0,scenes.length-1),r=(el%dur)/dur;if(idx!==last){show(scenes[idx],idx,r);last=idx}else updateProgress(idx,r)}requestAnimationFrame(loop)}pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'继续':'暂停'};show(scenes[0],0,0);requestAnimationFrame(loop);
})();
</script>
